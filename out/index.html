 brutal fight club where adult black and red belts would willingly allow him to walk across their stomachs to test their physical conditioning.\n\nHis descent into pure antagonism occurred when he weaponized this lethal, adult-only pain-tolerance ritual against the most vulnerable students in his care. Enraged that eight-year-old [Rachel](rachel) had the defiance to call him \"mean,\" Curtis deliberately stepped on her, her ten-year-old brother, [Michael](michael), and a profoundly young six-year-old boy named [Drew](drew). \n\nThe blunt-force trauma he inflicted was catastrophic. Michael and Rachel were hospitalized with torn fascia and internal injuries that stole months of their childhood, but the consequences for Drew were permanent. The sheer physics of Curtis's weight ruptured the six-year-old's internal organs, requiring emergency, life-saving surgery and leaving him immunocompromised for the remainder of his life. \n\nMaster Curtis did not use a weapon; he simply shifted his weight. It was an unfathomable abuse of power that ultimately led to his arrest, but not before permanently altering the lives of the children he was sworn to protect.\n9:T480,# Drew\n\nAt only six years old, Drew stepped onto the mats of the Dojang with the quiet, trusting innocence of a child. He was the youngest of the group when Master [Curtis](curtis) weaponized an adult pain-tolerance ritual against them. \n\nBecause of his young age and size, the blunt-force physical trauma Drew endured when Curtis stepped on him was catastrophic. He suffered severe internal bleeding that necessitated emergency, life-saving surgery. While the surgeons were able to save his life, the sheer physical devastation of that day left lasting, permanent scars on his body. As a result of the trauma and the emergency interventions required to save him, Drew was left immunocompromised for the rest of his life.\n\nDrew's story is one of profound, unspeakable tragedy, but also of quiet, enduring strength. He survived an act of inexplicable adult cruelty that stole his physical health, yet he continues to live with the heavy consequences of that day. In the lore of the Dojang, Drew is remembered not merely as a victim of a monstrous act, but with the utmost dignity as a true survivor who bore the heaviest, most permanent physical cost.\n\na:T4c3,# Michael\n\nMichael was ten years old when his life—and his perspective on authority—was irrevocably altered on the mats of the Dojang. Testing for his brown belt alongside his eight-year-old sister, [Rachel](rachel), Michael was subjected to the cruelty of Master [Curtis](curtis).\n\nWhen Curtis retaliated against Rachel, Michael—along with a six-year-old boy named [Drew](drew)—was caught in the crossfire. The trauma of being crushed beneath the weight of a grown man left Michael with severe physical injuries, including partially torn abdominal fascia that required months of grueling recovery. He lost the freedom of his fall, anchored to a bedpan and homebound tutoring. But even as he suffered, he witnessed the unimaginable: little Drew being rushed to emergency surgery to save his life.\n\nHowever, the physical devastation was met with a fierce emotional resolve. In the pediatric trauma bay, clutching his sister's hand under the harsh fluoresc"])</script><script>self.__next_f.push([1,"ent lights, Michael realized that the adults who had allowed this to happen were ruined, but the children were not. Curtis’s attempt to break them only succeeded in forging an unbreakable wall between Michael, Rachel, Drew, and the rest of their cohort.\n\nb:T539,# Rachel\n\nRachel's early years in the Dojang were shattered by a profound betrayal of trust from an authority figure. As a young martial arts student, she was subjected to the cruelty of Master [Curtis](curtis), an instructor who weaponized his rank to terrorize his students.\n\nDespite her young age—only eight years old at the time—Rachel possessed a fierce, innate courage. She was the one who found her voice to call Curtis out, telling him directly that he was mean. In retaliation, Curtis took a brutal, adult-only pain-tolerance ritual and turned it against the children. He deliberately stepped on Rachel, her ten-year-old brother, [Michael](michael), and a six-year-old boy named [Drew](drew), using his full adult weight to crush them.\n\nThe sheer physics of the act caused devastating physical trauma, including torn fascia, forcing Rachel and Michael to be bedridden for months. The incident left Rachel with deep psychological scars, manifesting as selective mutism—a defense mechanism against the adults who had failed to protect them. \n\nYet, in the dim light of the pediatric trauma bay, Curtis’s attempt to break them had the opposite effect. It forged an impenetrable wall between Rachel, Michael, Drew, and their closest friends. Her voice may have been weaponized against her, but her spirit remained unbroken. \n"])</script><script>self.__next_f.push([1,"5:[[\"children\",{\"s\":\"__PAGE__\",\"h\":512,\"d\":{\"r\":[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"main\",null,{\"className\":\"flex min-h-screen flex-col items-center justify-between\",\"children\":[\"$\",\"$L7\",null,{\"data\":{\"nodes\":[{\"id\":\"arthur-bennett\",\"name\":\"Arthur Bennett\",\"group\":\"character\",\"val\":10,\"content\":\"# Arthur Bennett\\n\\nArthur Bennett is a key figure originating from the `/luna-leo` narrative. Raised with a strong sense of independence, Arthur grew up completely unaware of his extended family on his father's side. \\n\\n## The Bennett Schism of 1978\\nBefore Arthur was born, his father and his uncle had a catastrophic falling out over a failed family business venture and a disputed inheritance. The argument was so volatile that the two brothers permanently severed all ties. Incredibly, both branches of the family remained in Virginia Beach, VA, but actively hid the existence of the other from their children. They could pass each other at the grocery store and never know they were blood relatives. \\n\\nBecause of this, Arthur grew up never knowing he had a paternal cousin named [Sam Bennett](/vault/characters/sam-bennett.md), nor does he know about Sam's descendants (including Jack and Sarah).\\n\\n\",\"metadata\":{\"tags\":[\"bennett-family\",\"luna-leo\"]}},{\"id\":\"curtis\",\"name\":\"Master Curtis\",\"group\":\"character\",\"val\":10,\"content\":\"$8\",\"metadata\":{\"tags\":[\"antagonist\",\"instructor\"]}},{\"id\":\"drew\",\"name\":\"Drew\",\"group\":\"character\",\"val\":10,\"content\":\"$9\",\"metadata\":{\"tags\":[\"survivor\",\"martial-artist\"]}},{\"id\":\"jack-bennett\",\"name\":\"Jack Bennett\",\"group\":\"character\",\"val\":10,\"content\":\"# Jack Bennett\\n\\nJack Bennett is the son of [Sam Bennett](/vault/characters/sam-bennett.md) and the brother of [Sarah Bennett](/vault/characters/sarah-bennett.md). He is part of the Bennett family branch that remained completely separated from his second cousin [Arthur Bennett](/vault/characters/arthur-bennett.md) due to the Bennett Schism of 1978.\\n\\nJack grew up in Virginia Beach, VA, unaware of the broader family tree that had been hidden from him by his grandfather.\\n\\n\",\"metadata\":{\"tags\":[\"bennett-family\"]}},{\"id\":\"michael\",\"name\":\"Michael\",\"group\":\"character\",\"val\":10,\"content\":\"$a\",\"metadata\":{\"tags\":[\"protagonist\",\"survivor\"]}},{\"id\":\"rachel\",\"name\":\"Rachel\",\"group\":\"character\",\"val\":10,\"content\":\"$b\",\"metadata\":{\"tags\":[\"survivor\",\"martial-artist\"]}},{\"id\":\"sam-bennett\",\"name\":\"Sam Bennett\",\"group\":\"character\",\"val\":10,\"content\":\"# Sam Bennett\\n\\nSam Bennett is the paternal cousin of [Arthur Bennett](/vault/characters/arthur-bennett.md). Despite both living in Virginia Beach, VA for their entire lives, the two cousins have never met.\\n\\n## The Bennett Schism of 1978\\nSam's father and Arthur's father were brothers who had a catastrophic falling out over a failed business venture and a disputed inheritance in 1978. The split was so absolute that neither brother spoke of the other again. Consequently, Sam grew up completely oblivious to Arthur's existence.\\n\\nSam eventually started a family of his own, having two children: [Jack Bennett](/vault/characters/jack-bennett.md) and [Sarah Bennett](/vault/characters/sarah-bennett.md).\\n\\n\",\"metadata\":{\"tags\":[\"bennett-family\",\"universal-lore\"]}},{\"id\":\"sarah-bennett\",\"name\":\"Sarah Bennett\",\"group\":\"character\",\"val\":10,\"content\":\"# Sarah Bennett\\n\\nSarah Bennett is the daughter of [Sam Bennett](/vault/characters/sam-bennett.md) and the sister of [Jack Bennett](/vault/characters/jack-bennett.md). She was born and raised in Virginia Beach, VA.\\n\\nLike the rest of her immediate family, Sarah is entirely unaware of the Bennett Schism of 1978 and does not know of the existence of her second cousin, [Arthur Bennett](/vault/characters/arthur-bennett.md).\\n\\nSarah's name and identity later became the namesake for a deployment automation script (`sarah-deploy.sh`) within the RaggieSoft server infrastructure.\\n\\n\",\"metadata\":{\"tags\":[\"bennett-family\"]}}],\"links\":[{\"source\":\"arthur-bennett\",\"target\":\"sam-bennett\",\"type\":\"cousin\",\"context\":\"Arthur's paternal cousin. They never met due to the Bennett Schism of 1978, where their fathers had a catastrophic falling out over a failed business venture.\"},{\"source\":\"curtis\",\"target\":\"rachel\",\"type\":\"victim\",\"context\":\"Curtis abused his position as a Master to inflict trauma on Rachel.\"},{\"source\":\"curtis\",\"target\":\"michael\",\"type\":\"victim\",\"context\":\"Curtis subjected Michael and his sister to an adult pain-tolerance ritual.\"},{\"source\":\"drew\",\"target\":\"michael\",\"type\":\"friend\",\"context\":\"Endured the trauma alongside Michael and Rachel.\"},{\"source\":\"drew\",\"target\":\"rachel\",\"type\":\"friend\",\"context\":\"Endured the trauma alongside Michael and Rachel.\"},{\"source\":\"drew\",\"target\":\"curtis\",\"type\":\"abuser\",\"context\":\"Curtis caused catastrophic injuries to Drew that permanently altered his life.\"},{\"source\":\"jack-bennett\",\"target\":\"sam-bennett\",\"type\":\"parent\",\"context\":\"Jack's father.\"},{\"source\":\"jack-bennett\",\"target\":\"sarah-bennett\",\"type\":\"sibling\",\"context\":\"Jack's sister.\"},{\"source\":\"michael\",\"target\":\"rachel\",\"type\":\"sibling\",\"context\":\"Michael's younger sister. He stood by her side during the trauma at the Dojang.\"},{\"source\":\"michael\",\"target\":\"curtis\",\"type\":\"abuser\",\"context\":\"Curtis abused his authority, critically injuring Michael.\"},{\"source\":\"rachel\",\"target\":\"curtis\",\"type\":\"abuser\",\"context\":\"Master Curtis weaponized his rank and an adult-only pain conditioning ritual against Rachel and her brother.\"},{\"source\":\"rachel\",\"target\":\"michael\",\"type\":\"sibling\",\"context\":\"Rachel's brother. They endured the trauma together, which forged an unbreakable bond.\"},{\"source\":\"sam-bennett\",\"target\":\"arthur-bennett\",\"type\":\"cousin\",\"context\":\"Sam's paternal cousin. They never met due to the Bennett Schism of 1978.\"},{\"source\":\"sam-bennett\",\"target\":\"jack-bennett\",\"type\":\"child\",\"context\":\"Sam's son.\"},{\"source\":\"sam-bennett\",\"target\":\"sarah-bennett\",\"type\":\"child\",\"context\":\"Sam's daughter.\"},{\"source\":\"sarah-bennett\",\"target\":\"sam-bennett\",\"type\":\"parent\",\"context\":\"Sarah's father.\"},{\"source\":\"sarah-bennett\",\"target\":\"jack-bennett\",\"type\":\"sibling\",\"context\":\"Sarah's brother.\"}]}}]}],[\"$Lc\"],\"$Ld\"]}],\"p\":false,\"v\":null}}]]\n"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"c\":[\"\",\"\"],\"q\":\"\",\"i\":false,\"t\":{\"t\":{\"s\":\"\",\"h\":528,\"d\":{\"r\":[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/2fljl6u7zzaqr.
